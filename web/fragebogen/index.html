  Zum Selbsthosten: die drei Familien nach /fonts/ legen, die zwei Zeilen

<style>
/* ========================= TOKENS ========================= */
:root{
  --paper:#F4F6F2; --sheet:#FFFFFF; --rule:#DBE2DA; --rule-hard:#B9C4BA;
  --ink:#141A17; --ink-soft:#4A554E; --ink-faint:#78837B;
  --loden:#2E5A44; --loden-soft:#E3EDE6;
  --ochre:#9C6B0E; --ochre-soft:#F7EEDB;
  --brick:#8E3527; --brick-soft:#F7E5E1;
  --indigo:#2C4C6B; --indigo-soft:#E2EAF1;
  --shadow:0 1px 2px rgba(20,26,23,.05), 0 10px 26px -14px rgba(20,26,23,.20);
  --btn-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1211; --sheet:#161C1A; --rule:#28312E; --rule-hard:#3B4642;
    --ink:#E7EBE6; --ink-soft:#A8B3AC; --ink-faint:#7B857F;
    --loden:#79B495; --loden-soft:#1B2D25;
    --ochre:#D9A23C; --ochre-soft:#2B2416;
    --brick:#D08272; --brick-soft:#2E1D1A;
    --indigo:#8FB4D4; --indigo-soft:#18242F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
    --btn-ink:#0E1211;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1211; --sheet:#161C1A; --rule:#28312E; --rule-hard:#3B4642;
  --ink:#E7EBE6; --ink-soft:#A8B3AC; --ink-faint:#7B857F;
  --loden:#79B495; --loden-soft:#1B2D25;
  --ochre:#D9A23C; --ochre-soft:#2B2416;
  --brick:#D08272; --brick-soft:#2E1D1A;
  --indigo:#8FB4D4; --indigo-soft:#18242F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.75);
  --btn-ink:#0E1211;
}

/* ========================= BASE ========================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0;
  overflow-wrap:break-word}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 22px 40px}

.skip{position:absolute;left:-9999px;top:0;background:var(--loden);color:#fff;
  padding:12px 18px;z-index:100;font-weight:700}
.skip:focus{left:0}

:where(h1,h2,h3)[tabindex="-1"]{outline:none}

/* ========================= PROGRESS RAIL ========================= */
.rail{position:sticky;top:0;z-index:20;background:var(--paper);padding:14px 22px 0}
.rail>*{max-width:760px;margin-inline:auto}
.rail-bar{height:4px;background:var(--rule);overflow:hidden}
.rail-fill{height:100%;background:var(--loden);width:0;transition:width .3s ease}
.rail-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.rail-meta strong{color:var(--loden);font-weight:600}

/* ========================= MASTHEAD ========================= */
.mast{border-bottom:2px solid var(--ink);padding:26px 0 12px;margin-bottom:34px}
.mast .kick{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--loden);margin:0 0 10px}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:400;
  font-size:clamp(2rem,5vw,2.9rem);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--loden)}
.mast .lang{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin:12px 0 0}

.lede{font-size:1.14rem;line-height:1.55;color:var(--ink-soft);margin:0 0 22px;max-width:60ch}
.lede strong{color:var(--ink);font-weight:700}

.boundary{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--ochre);
  padding:20px 24px;margin:26px 0}
.boundary h3{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ochre);margin:0 0 12px;font-weight:600}
.boundary p{margin:0 0 10px;font-size:.95rem;color:var(--ink-soft)}
.boundary p:last-child{margin:0}
.boundary b{color:var(--ink)}

.preview{background:var(--sheet);border:1px solid var(--rule);padding:0;margin:26px 0;box-shadow:var(--shadow)}
.preview-h{padding:13px 22px;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-faint)}
.preview ol{margin:0;padding:16px 22px 18px 42px;font-size:.92rem;color:var(--ink-soft)}
.preview li{margin-bottom:5px}
.preview li b{color:var(--ink)}

/* ========================= QUESTION CARD ========================= */
.qcard{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);padding:28px 30px}
@media(max-width:560px){.qcard{padding:22px 18px}}
.qsec{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--loden);font-weight:600;margin:0 0 10px}
h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.5rem;
  line-height:1.24;letter-spacing:-.012em;margin:0 0 8px;text-wrap:balance}
.qhelp{font-size:.95rem;color:var(--ink-soft);margin:0 0 22px;max-width:56ch}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--sheet);border:1.5px solid var(--rule-hard);color:inherit;font:inherit;
  text-align:left;padding:16px 18px;cursor:pointer;min-height:60px;display:flex;
  flex-direction:column;justify-content:center;gap:3px;transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--loden);background:var(--loden-soft)}
.opt:focus-visible{outline:2px solid var(--loden);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--loden);background:var(--loden-soft);border-width:2px}
.opt .lab{font-weight:700;font-size:1.02rem}
.opt .sub{font-size:.85rem;color:var(--ink-faint)}
.opt[aria-pressed="true"] .sub{color:var(--ink-soft)}

.chks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:560px){.chks{grid-template-columns:1fr}}
.chk{background:var(--sheet);border:1.5px solid var(--rule-hard);color:inherit;font:inherit;
  text-align:left;padding:12px 14px;cursor:pointer;min-height:52px;display:flex;align-items:center;
  gap:10px;font-size:.93rem;transition:border-color .14s,background .14s}
.chk:hover{border-color:var(--loden)}
.chk:focus-visible{outline:2px solid var(--loden);outline-offset:2px}
.chk .box{width:20px;height:20px;border:1.5px solid var(--rule-hard);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sheet)}
.chk[aria-pressed="true"]{border-color:var(--loden);background:var(--loden-soft)}
.chk[aria-pressed="true"] .box{background:var(--loden);border-color:var(--loden);color:#fff}
.chk[aria-pressed="true"] .box::after{content:"✓"}
.maxnote{font-size:.85rem;color:var(--ink-faint);margin:10px 0 0}

/* ========================= REALITY CARD ========================= */
.reality{margin-top:22px;background:var(--sheet);border:1px solid var(--rule);
  border-left:4px solid var(--loden);padding:20px 22px}
.reality.warn{border-left-color:var(--ochre)}
.reality.urgent{border-left-color:var(--brick)}
.reality.value{border-left-color:var(--indigo)}
.reality .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600;color:var(--loden);margin:0 0 9px}
.reality.warn .tag{color:var(--ochre)}
.reality.urgent .tag{color:var(--brick)}
.reality.value .tag{color:var(--indigo)}
.reality p{font-family:"Source Serif 4",Georgia,serif;font-size:1.03rem;line-height:1.52;
  margin:0 0 10px;color:var(--ink)}
.reality p:last-child{margin:0}
.reality b{font-weight:600}

/* ========================= BUTTONS ========================= */
.nav{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:15px 26px;border:none;cursor:pointer;
  background:var(--loden);color:var(--btn-ink);min-height:54px;font-size:1rem;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--rule-hard);font-weight:400}
.btn.ghost:hover{border-color:var(--ink-faint);filter:none}
.btn.quiet{background:transparent;color:var(--ink-faint);border:none;font-weight:400;
  font-size:.9rem;padding:10px 4px;min-height:44px;text-decoration:underline}
.btn.quiet:hover{color:var(--brick);filter:none}
.btn svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
@media(max-width:560px){
  .nav{gap:9px}
  .btn{flex:1 1 100%;padding:15px 18px}
  .btn.quiet{flex:1 1 100%}
}

/* ========================= DAS BLATT ========================= */
.brief{background:var(--sheet);border:1px solid var(--rule-hard);box-shadow:var(--shadow);
  font-family:"Source Serif 4",Georgia,serif}
.brief-head{padding:24px 30px 18px;border-bottom:2px solid var(--ink)}
.brief-head .org{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
.brief-head h2{font-size:1.6rem;margin:0 0 4px;font-weight:600}
.brief-head .sub{font-family:"Atkinson Hyperlegible",sans-serif;font-size:.86rem;
  color:var(--ink-soft);margin:0}
.brief-ref{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule)}
.brief-ref div{flex:1 1 33%;min-width:150px;padding:11px 30px;border-right:1px solid var(--rule)}
.brief-ref div:last-child{border-right:none}
.brief-ref dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 3px}
.brief-ref dd{margin:0;font-size:.98rem;font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.9rem}

.bsec{padding:20px 30px;border-bottom:1px solid var(--rule)}
.bsec:last-child{border-bottom:none}
.bsec h3{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 14px;font-weight:600;
  display:flex;align-items:baseline;gap:9px}
.bsec h3 .no{color:var(--loden)}
@media(max-width:560px){.bsec,.brief-head{padding-left:18px;padding-right:18px}
  .brief-ref div{padding-left:18px;padding-right:18px}}

.rows{display:grid;grid-template-columns:210px minmax(0,1fr);gap:7px 18px;font-size:.98rem;margin:0}
@media(max-width:560px){.rows{grid-template-columns:1fr;gap:2px}}
.rows dt{font-family:"Atkinson Hyperlegible",sans-serif;font-size:.83rem;color:var(--ink-faint)}
.rows dd{margin:0}
.stat{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.78rem;font-weight:600;
  padding:2px 7px;border:1px solid currentColor;letter-spacing:.05em;white-space:nowrap}
.stat.ok{color:var(--loden)} .stat.no{color:var(--brick)} .stat.unk{color:var(--ochre)}

.flag{display:flex;gap:13px;padding:13px 0;border-bottom:1px dotted var(--rule)}
.flag:last-child{border-bottom:none}
.flag .sev{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;height:fit-content;
  white-space:nowrap;border:1px solid currentColor}
.flag.urgent .sev{color:var(--brick);background:var(--brick-soft)}
.flag.warn .sev{color:var(--ochre);background:var(--ochre-soft)}
.flag.value .sev{color:var(--indigo);background:var(--indigo-soft)}
.flag .body{flex:1}
.flag .ttl{font-weight:600;margin:0 0 3px;font-size:1.01rem}
.flag .dsc{margin:0;font-size:.92rem;color:var(--ink-soft);
  font-family:"Atkinson Hyperlegible",sans-serif;line-height:1.5}

.qlist{margin:0;padding-left:22px;font-size:1rem}
.qlist li{margin-bottom:8px}
.qlist li:last-child{margin-bottom:0}

.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 18px;font-size:.93rem;
  font-family:"Atkinson Hyperlegible",sans-serif}
@media(max-width:560px){.docs{grid-template-columns:1fr}}
.docs span{display:flex;gap:8px;align-items:baseline}
.docs .m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;flex-shrink:0}
.docs .has .m{color:var(--loden)} .docs .miss .m{color:var(--ochre)}
.docs .miss{color:var(--ink-faint)}

.brief-foot{padding:18px 30px;background:var(--paper);
  font-family:"Atkinson Hyperlegible",sans-serif;font-size:.83rem;color:var(--ink-faint)}
.brief-foot p{margin:0 0 6px;max-width:none}
.brief-foot p:last-child{margin:0}

/* Notizfeld — nur im Ausdruck */
.notes{display:none}
.notes .line{border-bottom:.5pt solid #999;height:9mm}
.notes .notesref{font-family:"Atkinson Hyperlegible",sans-serif;font-size:8pt;color:#666;
  margin:0 0 10pt}

.after{margin-top:30px;background:var(--sheet);border:1px solid var(--rule);padding:24px 28px}
@media(max-width:560px){.after{padding:20px 18px}}
.after h3{font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;margin:0 0 12px;font-weight:600}
.after h3+ul{margin-top:0}
.after ul{margin:0 0 18px;padding-left:20px;font-size:.96rem;color:var(--ink-soft)}
.after li{margin-bottom:6px}
.after b{color:var(--ink)}
.actions{border-top:1px solid var(--rule);margin-top:22px;padding-top:20px}
.actions .lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 12px}

/* ========================= FOOT / TOAST / NOSCRIPT ========================= */
.site-foot{border-top:1px solid var(--rule);margin-top:56px;padding:22px 0 30px;
  font-size:.84rem;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:8px 22px;
  align-items:baseline;justify-content:space-between}
.site-foot a{color:var(--ink-soft)}
.site-foot .links{display:flex;gap:18px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);
  color:var(--paper);padding:13px 22px;font-size:.92rem;font-weight:700;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}

.noprint-note{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin:18px 0 0;text-align:center}

.nojs{background:var(--sheet);border-left:3px solid var(--brick);padding:20px 24px;margin:26px 0}
.nojs p{margin:0;color:var(--ink-soft)}

/* ========================= DRUCK ========================= */
@page{size:A4;margin:16mm 15mm 18mm}
@media print{
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt}
  .rail,.mast,.nav,.after,.toast,.noprint-note,.site-foot,.skip,.screen-only,.nojs{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  .brief{border:none;box-shadow:none;background:#fff}
  .brief-head{padding:0 0 10pt;border-bottom:1.5pt solid #000}
  .brief-head h2{font-size:16pt}
  .brief-head .org,.brief-head .sub{color:#444}
  .brief-ref{border-bottom:.5pt solid #999}
  .brief-ref div{padding:7pt 0;border-right:.5pt solid #ccc}
  .brief-ref div:first-child{padding-left:0}
  .brief-ref div:not(:first-child){padding-left:10pt}
  /* Abschnitte dürfen umbrechen; einzelne Einträge nicht, und eine
     Überschrift bleibt nie allein am Seitenende stehen. */
  .bsec{padding:12pt 0;border-bottom:.5pt solid #ccc}
  .bsec h3{color:#444;page-break-after:avoid;break-after:avoid}
  .bsec h3 .no{color:#000}
  .rows,.docs{page-break-inside:avoid}
  .qlist li{page-break-inside:avoid}
  .flag{page-break-inside:avoid;border-bottom:.4pt dotted #bbb}
  .flag .dsc,.rows dt,.docs .miss{color:#333}
  /* Severity-Chips müssen im Ausdruck lesbar bleiben */
  .flag.urgent .sev{color:#000;background:#fff;border:1pt solid #000;font-weight:700}
  .flag.warn  .sev{color:#333;background:#fff;border:.6pt solid #666}
  .flag.value .sev{color:#333;background:#fff;border:.6pt solid #666;font-weight:700}
  .stat{border:.6pt solid #666;color:#000!important}
  .stat.no{border-width:1pt;font-weight:700}
  .brief-foot{background:#fff;padding:10pt 0 0;color:#444;border-top:.5pt solid #ccc}
  .notes{display:block;page-break-before:always;padding:0}
  .docs .has .m,.docs .miss .m{color:#000}
  a{color:#000;text-decoration:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Eingabefelder + Senden ans Steuerbüro (intake-autopilot) ===== */
.fgrid{display:flex;flex-direction:column;gap:18px}
.fld label{display:block;font-weight:700;font-size:.98rem;margin:0 0 6px}
.fld .hint{display:block;font-weight:400;font-size:.85rem;color:var(--ink-faint);margin-top:1px}
.fld input,.fld select{width:100%;font:inherit;color:var(--ink);background:var(--sheet);
  border:1.5px solid var(--rule-hard);padding:13px 14px;min-height:52px;border-radius:0}
.fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--loden);outline-offset:1px;border-color:var(--loden)}
.fld.bad input{border-color:var(--brick)}
.fld .err{color:var(--brick);font-size:.85rem;margin:5px 0 0}
.sendbox{margin:0 0 26px;padding:18px 20px;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--loden)}
.sendbox.err{border-left-color:var(--brick)}
.sendbox p{margin:0 0 4px}
.sendbox .nav{margin-top:14px}
</style>
</head>
<body>

<a class="skip" href="#app">Zum Fragebogen springen</a>

<div class="rail screen-only" id="rail" hidden>
  <div class="rail-bar"><div class="rail-fill" id="railFill"></div></div>
  <div class="rail-meta">
    <span id="railSec">—</span>
    <span>Frage <strong id="railN">0</strong> von <span id="railTot">16</span></span>
  </div>

const KEY = "steuermappe.de.v1" + (CLIENT_ID ? ".c" + CLIENT_ID : "") + (INVITE_REF ? "." + INVITE_REF : "");
let state = {};
let idx = -1;
let savedIdx = 0;

try {
  const raw = localStorage.getItem(KEY);
  if(raw){ const p = JSON.parse(raw); state = p.state || {}; savedIdx = p.idx || 0; }
} catch(e){ /* Private-Mode o. Ä. — die Seite funktioniert trotzdem, nur ohne Merken */ }

function save(){
  try { localStorage.setItem(KEY, JSON.stringify({state, idx:Math.max(0,idx), t:Date.now()})); }
  catch(e){}
}
function wipe(){
  try { localStorage.removeItem(KEY); } catch(e){}
  state = {}; savedIdx = 0;
}
function visible(){ return Q.filter(q => !q.skipIf || !q.skipIf(state)); }

const app  = document.getElementById("app");
const mast = document.getElementById("mast");
const rail = document.getElementById("rail");
const BASE_TITLE = document.title;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ═══════════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════════ */
function render(){
  document.title = BASE_TITLE;
  if(idx < 0) return renderIntro();
  const vis = visible();
  if(idx >= vis.length) return renderBrief();
  renderQuestion(vis[idx], vis);
}

function renderIntro(){

  const resumable = Object.keys(state).length > 0;
  app.innerHTML = `
    <p class="lede">${visible().length} Fragen zu Ihrer Arbeit in Österreich. Am Ende bekommen Sie ein Blatt Papier
    für Ihre Steuerberaterin — <strong>damit die Stunde bei ihr für Antworten draufgeht und nicht

    <div class="boundary">

      eine Fachfrau arbeiten kann. Die Antworten bekommen Sie von der Steuerberaterin.</p>

      <div class="preview-h">Das haben Sie am Ende in der Hand</div>
      <ol>
        <li><b>Ihre Situation</b> — wie lange, wie Sie arbeiten, wie viele Haushalte</li>
        <li><b>Ihre Anmeldungen</b> — Gewerbe, SVS, Steuernummer: bestätigt oder offen</li>
        <li><b>Fragen, die nur eine Fachfrau beantworten kann</b></li>
        <li><b>Wichtige Punkte</b> — was eilig ist, was zu prüfen ist, wo Geld für Sie da sein könnte</li>
        <li><b>Ihre Unterlagen</b> — was Sie haben und was Sie noch suchen sollten</li>
        <li><b>Ihre Fragen</b>, in der Reihenfolge zum Fragen</li>
      </ol>
    </div>

    <div class="nav">
      <button class="btn" id="start" type="button">${resumable ? "Weitermachen" : "Starten"}</button>
      ${resumable ? '<button class="btn ghost" id="restart" type="button">Neu beginnen</button>' : ""}
    </div>
    <p class="noprint-note">Dauert etwa zehn Minuten · ${SEND_ENABLED ? "Am Ende schicken Sie die Antworten an Ihr Steuerbüro — nur dorthin, nicht ins Internet" : "Am Ende bekommen Sie ein PDF für Ihr Steuerbüro · Diese Seite speichert nichts im Internet"}</p>
  `;
  document.getElementById("start").onclick = ()=>{
    idx = Object.keys(state).length ? Math.min(savedIdx, visible().length) : 0;
    scrollTop(); render();
  };
  const r = document.getElementById("restart");
  if(r) r.onclick = ()=>{
    if(!confirm("Alle Antworten löschen und neu beginnen?")) return;

function renderQuestion(q, vis){
  rail.hidden = false; mast.hidden = true;
  const n = idx + 1;
  document.getElementById("railFill").style.width = (n/(vis.length+1)*100) + "%";
  document.getElementById("railSec").textContent = SECTIONS[q.sec];
  document.getElementById("railN").textContent = n;
  document.getElementById("railTot").textContent = vis.length;
  if(q.kind==="fields") return renderFields(q, vis);

  const cur = state[q.id];
  const isMulti = !!q.multi;
  const sel = isMulti ? (Array.isArray(cur)?cur:[]) : cur;

  const optsHtml = q.opts.map(o=>{
    const on = isMulti ? sel.includes(o.v) : sel===o.v;
    if(isMulti){
      return `<button class="chk" type="button" data-v="${o.v}" aria-pressed="${on}">
        <span class="box" aria-hidden="true"></span><span>${esc(o.lab)}</span></button>`;
    }
    return `<button class="opt" type="button" data-v="${o.v}" aria-pressed="${on}">
      <span class="lab">${esc(o.lab)}</span>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:""}</button>`;
  }).join("");

  app.innerHTML = `
    <div class="qcard">
      <p class="qsec">${SECTIONS[q.sec]}</p>
      <h2 id="qh" tabindex="-1">${esc(q.q)}</h2>
      ${q.help?`<p class="qhelp">${esc(q.help)}</p>`:""}
      <div class="${isMulti?"chks":"opts"}" id="opts" role="group" aria-labelledby="qh">${optsHtml}</div>
      ${q.max?`<p class="maxnote" id="maxnote"></p>`:""}
      <div id="realitySlot" aria-live="polite"></div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="back" type="button">Zurück</button>
      <button class="btn" id="next" type="button" ${canAdvance(q)?"":"disabled"}>${idx===vis.length-1?"Mein Blatt erstellen":"Weiter"}</button>
    </div>
  `;

  showReality(q); showMax(q);

  document.getElementById("opts").addEventListener("click", e=>{
    const b = e.target.closest("[data-v]"); if(!b) return;
    const v = b.dataset.v;
    if(isMulti){
      const arr = Array.isArray(state[q.id]) ? state[q.id].slice() : [];
      const i = arr.indexOf(v);
      if(i>=0) arr.splice(i,1);
      else {
        if(q.max && arr.length>=q.max){ showToast("Bitte höchstens " + q.max + " auswählen"); return; }
        arr.push(v);
      }
      state[q.id]=arr;
    } else { state[q.id]=v; }
    save();
    [...document.querySelectorAll("#opts [data-v]")].forEach(el=>{
      const on = isMulti ? (state[q.id]||[]).includes(el.dataset.v) : state[q.id]===el.dataset.v;
      el.setAttribute("aria-pressed", on);
    });
    document.getElementById("next").disabled = !canAdvance(q);
    showReality(q); showMax(q);
  });

  document.getElementById("back").onclick = ()=>{ idx=Math.max(-1, idx-1); save(); scrollTop(); render(); };
  document.getElementById("next").onclick = ()=>{ idx++; save(); scrollTop(); render(); };

  const h = document.getElementById("qh"); if(h) h.focus({preventScroll:true});
}

function fv(k){ return ((state.f||{})[k] ?? "").toString().trim(); }
function fieldError(f){
  const v = fv(f.k);
  if(!v) return f.req ? "Bitte ausfüllen" : "";
  if(f.type==="digits" && f.len && v.replace(/\D/g,"").length!==f.len) return "Bitte genau " + f.len + " Ziffern";
  if(f.type==="num" && !/^\d+([.,]\d+)?$/.test(v)) return "Bitte nur eine Zahl";
  if(f.type==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return "Das sieht nicht wie eine E-Mail aus";
  return "";
}
function shownFields(q){ return q.fields.filter(f=>!f.showIf || f.showIf(state.f||{})); }

function renderFields(q, vis){
  state.f = state.f || {};
  if(!state.f.year) state.f.year = URL_YEAR || YEAR_OPTS[0];
  const inputHtml = f=>{
    const v = esc(fv(f.k)), id = "f_" + f.k;
    if(f.type==="select") return `<select id="${id}" data-k="${f.k}">${f.opts.map(o=>
      `<option value="${esc(o)}"${o===fv(f.k)?" selected":""}>${o?esc(o):"— bitte wählen —"}</option>`).join("")}</select>`;
    const t = f.type==="email" ? "email" : f.type==="tel" ? "tel" : "text";
    const im = (f.type==="digits"||f.type==="num") ? ' inputmode="numeric"' : f.type==="tel" ? ' inputmode="tel"' : "";
    return `<input id="${id}" data-k="${f.k}" type="${t}"${im} value="${v}" autocomplete="${f.ac||"off"}">`;
  };
  const draw = ()=>shownFields(q).map(f=>{
    const e = fieldError(f), touched = !!(state.f||{})[f.k];
    return `<div class="fld${e&&touched?" bad":""}">
      <label for="f_${f.k}">${esc(f.lab)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</label>
      ${inputHtml(f)}
      ${e&&touched?`<p class="err">${esc(e)}</p>`:""}
    </div>`;}).join("");

  app.innerHTML = `
    <div class="qcard">
      <p class="qsec">${SECTIONS[q.sec]}</p>
      <h2 id="qh" tabindex="-1">${esc(q.q)}</h2>
      ${q.help?`<p class="qhelp">${esc(q.help)}</p>`:""}
      <div class="fgrid" id="fgrid">${draw()}</div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="back" type="button">Zurück</button>
      <button class="btn" id="next" type="button" ${canAdvance(q)?"":"disabled"}>${idx===vis.length-1?"Mein Blatt erstellen":"Weiter"}</button>
    </div>
  `;
  const grid = document.getElementById("fgrid");
  const onEdit = e=>{
    const k = e.target.dataset && e.target.dataset.k; if(!k) return;
    state.f[k] = e.target.value; save();
    document.getElementById("next").disabled = !canAdvance(q);
    if(e.type==="change"){            // redraw on blur/select: errors + dependent fields
      const keep = document.activeElement && document.activeElement.id;
      grid.innerHTML = draw();
      const el = keep && document.getElementById(keep); if(el) el.focus({preventScroll:true});
    }
  };
  grid.addEventListener("input", onEdit);
  grid.addEventListener("change", onEdit);
  document.getElementById("back").onclick = ()=>{ idx=Math.max(-1, idx-1); save(); scrollTop(); render(); };
  document.getElementById("next").onclick = ()=>{ idx++; save(); scrollTop(); render(); };
  const h = document.getElementById("qh"); if(h) h.focus({preventScroll:true});
}

function canAdvance(q){
  if(q.kind==="fields") return shownFields(q).every(f=>!fieldError(f));
  const v = state[q.id];
  if(q.multi) return Array.isArray(v) && v.length>0;
  return !!v;
}

function showMax(q){
  const el = document.getElementById("maxnote"); if(!el || !q.max) return;
  const n = (state[q.id]||[]).length;
  el.textContent = n + " von " + q.max + " ausgewählt";
}

function showReality(q){
  const slot = document.getElementById("realitySlot"); if(!slot) return;
  const v = state[q.id];
  if(q.multi || !v){ slot.innerHTML=""; return; }
  const o = q.opts.find(x=>x.v===v);
  if(!o || !o.r || !REALITY[o.r]){ slot.innerHTML=""; return; }
  const r = REALITY[o.r];
  const tag = r.k==="urgent" ? "Das zuerst erledigen"
            : r.k==="value" ? "Hier könnte Geld für Sie sein"
            : r.k==="warn" ? "Gut zu wissen" : "So funktioniert das";
  slot.innerHTML = `<div class="reality ${r.k}">
    <p class="tag">${tag}</p>
    <p><b>${esc(r.t)}</b></p>
    ${r.b.map(p=>`<p>${p}</p>`).join("")}
  </div>`;
}

function buildFlags(){

  if(s.svs==="no"||s.svs==="unknown") f.push({sev:"warn", t:"SVS-Anmeldung ungeklärt",
    d:"Unklar, ob eine Anmeldung besteht und ob Post zugestellt wird. Möglicherweise laufen unbemerkt Beiträge auf. Anmeldung und Zustelladresse prüfen."});

  f.push({sev:"warn", t:"Steuerlicher Wohnsitz zu klären",

  if(s.households==="one") f.push({sev:"warn", t:"Nur ein Auftraggeber — Einstufung prüfen",
    d:"In den letzten zwölf Monaten nur ein Haushalt. Prüfung auf Scheinselbständigkeit sinnvoll, mit Hinweis auf die Folgen in beide Richtungen."});

  if(s.children==="ro"||s.children==="split"){

  }

  if(s.income==="o55000") f.push({sev:"warn", t:"Umsatz über der Kleinunternehmergrenze",
    d:"Angegebener Umsatz über 55.000 €. Umsatzsteuerpflicht und Rechnungslegung sind zu klären."});

  if(s.filed==="never") f.push({sev:"warn", t:"Noch nie eine Einkommensteuererklärung abgegeben",
    d:"Ohne Bescheid kann die SVS die Beiträge nicht endgültig feststellen; das Konto bleibt dauerhaft vorläufig. Offene Jahre feststellen und prüfen, ob eine Gutschrift besteht."});
  else if(s.filed==="some"||s.filed==="unknown") f.push({sev:"warn", t:"Unvollständige Abgabehistorie",

  return f;

function buildQuestions(){
  const s=state, out=[];
  if(s.letters==="mahnung") out.push("Die überfällige Zahlung — welche Möglichkeiten habe ich, und kann ich eine Ratenzahlung beantragen?");
  if(s.nachbem!=="yes") out.push("Wie viel soll ich jeden Monat für die Nachbemessung zur Seite legen?");
  else out.push("Wie viel Nachbemessung kommt noch, und für welche Jahre?");
  if(s.children==="ro"||s.children==="split") out.push("Steht mir Familienbeihilfe oder eine Ausgleichszahlung für meine Kinder in Rumänien zu — und geht das rückwirkend?");
  out.push("Wo bin ich eigentlich steuerpflichtig, so wie ich lebe und wohne?");
  if(s.gewerbe!=="yes") out.push("Besteht meine Gewerbeberechtigung wirklich, und läuft sie auf meinen Namen?");
  if(s.svs!=="yes") out.push("Bin ich bei der SVS richtig angemeldet, und ist dort etwas offen?");
  if(s.filed==="never"||s.filed==="some"||s.filed==="unknown") out.push("Welche Jahre muss ich noch abgeben, und was passiert, wenn ich sie verspätet abgebe?");
  if(s.households==="one") out.push("Ist es ein Problem für meine Selbständigkeit, dass ich nur für einen Haushalt arbeite?");
  if(s.channel==="agency"||s.channel==="both") out.push("Stimmt das, was die Agentur mir abzieht, und ist ihre Gebühr eine Betriebsausgabe?");
  if(s.income==="o55000") out.push("Muss ich mich jetzt um die Umsatzsteuer kümmern?");
  if((s.worry||[]).includes("pension")) out.push("Wie passen meine rumänischen und meine österreichischen Pensionsjahre zusammen?");
  if((s.worry||[]).includes("health")) out.push("Wo bin ich krankenversichert, und brauche ich eine A1-Bescheinigung?");
  out.push("Was soll ich künftig aufheben, und wie, damit das nächste Jahr leichter wird?");
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   PDF FÜRS BÜRO — lesbares Blatt + die Antworten maschinenlesbar in den
   PDF-Metadaten (Keywords: "STEUERMAPPE1:" + Base64-JSON). Das Büro liest
   sie exakt aus, ohne KI. Erzeugt wird alles hier im Browser.
   ═══════════════════════════════════════════════════════════════════════ */
function loadJsPdf(){
  if(window.jspdf) return Promise.resolve();
  return new Promise((res, rej)=>{
    const sc = document.createElement("script");
    sc.src = "/fragebogen-assets/jspdf.umd.min.js";
    sc.onload = ()=>res(); sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
function b64utf8(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
/* Standard-PDF-Schrift kann nur Latin-1: rumänische Sonderzeichen nur fürs Bild vereinfachen
   (in den Metadaten bleibt alles exakt). */
function pdfSafe(t){
  return String(t).replace(/[șş]/g,"s").replace(/[ȘŞ]/g,"S").replace(/[țţ]/g,"t").replace(/[ȚŢ]/g,"T")
    .replace(/ă/g,"a").replace(/Ă/g,"A").replace(/[–—]/g,"-").replace(/[„“”]/g,'"').replace(/[’‘]/g,"'")
    .replace(/[·•]/g,"-").replace(/…/g,"...").replace(/[^\x00-\xFF]/g,"?");
}
async function buildPdf(sub){
  await loadJsPdf();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  doc.setProperties({title:"Fragebogen " + sub.ref, subject:"Steuermappe Fragebogen", creator:"Steuermappe",
    keywords: PDF_MARK + b64utf8(JSON.stringify({v:1, ref:sub.ref, year:sub.year, fields:sub.fields,
      answers:sub.answers, flags:sub.flags, questions:sub.questions}))});
  const W = 210, M = 18; let y = 20;
  const foot = ()=>{ doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(pdfSafe("Kennnummer " + sub.ref + " - Selbstauskunft, ungeprüft - Seite " + doc.getNumberOfPages()), M, 289); doc.setTextColor(20); };
  const need = h=>{ if(y + h > 280){ foot(); doc.addPage(); y = 20; } };
  doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.text("Fragebogen Steuermappe", M, y); y += 8;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text(pdfSafe("Kennnummer: " + sub.ref + "    Steuerjahr: " + (sub.year || "-") + "    Erstellt: " + new Date().toLocaleDateString("de-AT")), M, y); y += 9;
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Angaben für die Steuer", M, y); y += 6;
  doc.setFontSize(10);
  dataRows().forEach(([l,v])=>{
    const lines = doc.splitTextToSize(pdfSafe(v || "-"), W - M - 85);
    need(lines.length*5 + 1);
    doc.setFont("helvetica","bold"); doc.text(doc.splitTextToSize(pdfSafe(l), 62), M, y);
    doc.setFont("helvetica","normal"); doc.text(lines, M + 67, y);
    y += Math.max(lines.length, doc.splitTextToSize(pdfSafe(l), 62).length) * 5 + 1.5;
  });
  y += 4;
  doc.setFont("courier","normal"); doc.setFontSize(8.5);
  sub.sheet_text.split("\n").forEach(line=>{
    doc.splitTextToSize(pdfSafe(line) || " ", W - 2*M).forEach(l=>{ need(4); doc.text(l, M, y); y += 3.9; });
  });
  foot();
  return doc.output("arraybuffer");
}
function downloadBlob(name, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

function dataRows(){
  const f = state.f || {};
  return FIELD_DEFS.filter(d=>!d.showIf || d.showIf(f) || f[d.k]).map(d=>{
    let v = (f[d.k] ?? "").toString().trim();
    if(d.k==="children" && state.children==="no") v = "0";
    return [d.lab.replace(/\?$/,""), v];
  });
}

const DOC_ORDER=["gewerbeschein","steuernr","vorschreibung","nachbem","bescheid","agencyc","agencys",
  "honorar","bank","travel","ecard","meldezettel","a1","ro_tax"];

function renderBrief(){
  rail.hidden = true; mast.hidden = false;
  const s = state;
  const flags = buildFlags();
  const questions = buildQuestions();
  const held = new Set(s.docs||[]);
  const worries = (s.worry||[]).map(w=>WORRY_LABELS[w]);
  const today = new Date().toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"});
  const ref = INVITE_REF || "SM-" + today.replace(/\./g,"") + "-" +
              Math.abs(JSON.stringify(s).split("").reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0)).toString(36).slice(0,4).toUpperCase();

  /* Dateiname beim „Als PDF speichern" und beim Download */

          <dt>Arbeit über</dt><dd>${CHANNEL_LABEL[s.channel]||"—"}</dd>
          <dt>Haushalte, 12 Monate</dt><dd>${HH_LABEL[s.households]||"—"}</dd>

          <dt>Wohnung / Zimmer</dt><dd>${HOME_LABEL[s.home]||"—"}</dd>
          <dt>Mittelpunkt des Lebens</dt><dd>${CENTRE_LABEL[s.centre]||"—"}</dd>

          <dt>Steuererklärungen</dt><dd>${FILED_LABEL[s.filed]||"—"}</dd>
        </dl>
      </div>

      <div class="bsec">
        <h3><span class="no">2</span> Anmeldungen</h3>
        <dl class="rows">
          <dt>Gewerbeberechtigung</dt><dd>${statusOf(s.gewerbe)}</dd>
          <dt>Anmeldung bei der SVS</dt><dd>${statusOf(s.svs)}</dd>
          <dt>Steuernummer</dt><dd>${statusOf(s.steuernr)}</dd>
          <dt>Offene Post</dt><dd>${s.letters==="mahnung"?`<span class="stat no">MAHNUNG / RÜCKSTAND</span>`:s.letters==="some"?`<span class="stat unk">UNERLEDIGTES</span>`:`<span class="stat ok">KEINE ANGEGEBEN</span>`}</dd>
        </dl>

        ${flags.map(f=>`<div class="flag ${f.sev}">

        <div class="nav">

          <button class="btn ghost" id="pdfdl" type="button">PDF speichern</button>
        </div>

      <h3>Vor dem Termin</h3>
      <ul>
        <li><b>Drucken Sie dieses Blatt aus</b> oder speichern Sie es, und nehmen Sie es mit.</li>

        ${(s.children==="ro"||s.children==="split")?`<li><b>Nehmen Sie die Geburtsurkunden Ihrer Kinder mit</b> und alles, was Rumänien gezahlt oder abgelehnt hat.</li>`:""}
        <li>Wenn Sie etwas nicht finden: Sagen Sie es. Eine ehrliche Lücke ist leichter als eine Vermutung.</li>
      </ul>
      <h3>Was dieses Blatt nicht kann</h3>
      <ul>
        <li>Es sagt nicht, wie viel Sie zahlen. Nicht, was Sie absetzen können. Nicht, wo Sie steuerpflichtig sind.</li>
        <li>Das beantwortet die Steuerberaterin — <b>und jetzt wissen Sie, was Sie fragen müssen.</b></li>
      </ul>

      <div class="actions">
        <p class="lbl">Blatt mitnehmen</p>
        <div class="nav">
          <button class="btn" id="print" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1"/><path d="M7 16h10v4H7z"/></svg>

          </button>
          <button class="btn ghost" id="copy" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M6 15H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v1"/></svg>

          </button>
          <button class="btn ghost" id="dl" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
            Als Datei speichern
          </button>
          ${canShare?`<button class="btn ghost" id="share" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/></svg>
            Weitergeben
          </button>`:""}
          ${CFG.mailTo?`<button class="btn ghost" id="mail" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
            Per E-Mail schicken
          </button>`:""}
        </div>
        <div class="nav">
          <button class="btn ghost" id="edit" type="button">Antwort ändern</button>
          <button class="btn quiet" id="del" type="button">Meine Antworten von diesem Gerät löschen</button>
        </div>
      </div>
    </div>
  `;

  const text = ()=>briefAsText(ref, today, flags, questions, held, worries);
  const fname = "Beiblatt-Erstberatung-" + ref + ".txt";

  document.getElementById("print").onclick = ()=>window.print();

  const submission = ()=>{
    const f = Object.assign({}, state.f||{});
    if(state.children==="no") f.children = "0";
    const answers = {}; Object.keys(state).forEach(k=>{ if(k!=="f") answers[k]=state[k]; });
    return {client_id: CLIENT_ID ? Number(CLIENT_ID) : null, year: Number(f.year)||null,
      fields: f, answers, ref, flags: flags.map(x=>({sev:x.sev, title:x.t})), questions, sheet_text: text()};
  };

  const pdfName = "Fragebogen_" + ref + "_" + ((state.f||{}).year || "") + ".pdf";
  const pdfBlob = async ()=>new Blob([await buildPdf(submission())], {type:"application/pdf"});
  const pdfDl = document.getElementById("pdfdl");
  if(pdfDl) pdfDl.onclick = async ()=>{
    try{ downloadBlob(pdfName, await pdfBlob()); showToast("PDF gespeichert: " + pdfName); }

  };
  const pdfSh = document.getElementById("pdfshare");
  if(pdfSh) pdfSh.onclick = async ()=>{
    try{
      const file = new File([await pdfBlob()], pdfName, {type:"application/pdf"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Fragebogen " + ref});
      } else {
        downloadBlob(pdfName, file);
        showToast("PDF gespeichert — bitte per WhatsApp oder E-Mail ans Büro schicken");
      }
    }catch(e){ if(e && e.name!=="AbortError") showToast("PDF hat nicht geklappt — bitte drucken"); }

  const sendBtn = document.getElementById("send");

    const box = document.getElementById("sendbox");

      const res = await fetch(CFG.api + "/api/questionnaire", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(submission())});
      const j = await res.json();
      if(!res.ok || !j.success) throw new Error(j.error || j.detail || res.status);
      box.className = "sendbox screen-only";
      box.innerHTML = `<p><b>Geschickt.</b> Das Steuerbüro hat Ihre Antworten (Kennnummer ${esc(ref)}).</p>
        <p>Sie können die Antworten jederzeit ändern und noch einmal schicken.</p>`;
    }catch(e){
      box.className = "sendbox err screen-only";
      sendBtn.disabled = false; sendBtn.textContent = "Noch einmal versuchen";
      showToast("Schicken hat nicht geklappt — bitte drucken oder speichern");
    }
  };

  document.getElementById("edit").onclick = ()=>{ idx = visible().length-1; save(); scrollTop(); render(); };

  document.getElementById("copy").onclick = ()=>{
    copyText(text()).then(
      ()=>showToast("In die Zwischenablage kopiert"),
      ()=>showToast("Kopieren hat nicht geklappt — bitte drucken oder speichern")
    );
  };

  document.getElementById("dl").onclick = ()=>{
    try { downloadText(fname, text()); showToast("Datei gespeichert: " + fname); }
    catch(e){ showToast("Speichern hat nicht geklappt — bitte drucken"); }
  };

  const sh = document.getElementById("share");
  if(sh) sh.onclick = ()=>{
    navigator.share({ title:"Beiblatt zur Erstberatung " + ref, text:text() })
      .catch(()=>{ /* Abbruch durch die Benutzerin ist kein Fehler */ });
  };

  const ml = document.getElementById("mail");
  if(ml) ml.onclick = ()=>{
    const body = encodeURIComponent(text());
    const subj = encodeURIComponent("Beiblatt zur Erstberatung " + ref);
    if(body.length > 1800){
      copyText(text()).then(
        ()=>{ showToast("Text kopiert — bitte in die E-Mail einfügen");
              window.location.href = "mailto:" + CFG.mailTo + "?subject=" + subj; },
        ()=>showToast("Bitte das Blatt ausdrucken und mitbringen")
      );
    } else {
      window.location.href = "mailto:" + CFG.mailTo + "?subject=" + subj + "&body=" + body;
    }
  };

  document.getElementById("del").onclick = ()=>{
    if(!confirm("Alle Ihre Antworten von diesem Gerät löschen? Das Blatt ist danach weg. Drucken oder speichern Sie es vorher.")) return;
    wipe(); idx = -1; scrollTop(); render();
    showToast("Gelöscht. Auf diesem Gerät ist nichts mehr gespeichert.");
  };

  const h = document.getElementById("briefH"); if(h) h.focus({preventScroll:true});
}

function briefAsText(ref, today, flags, questions, held, worries){
  const s=state, L=[];
  L.push("BEIBLATT ZUR ERSTBERATUNG");
  L.push("Selbständige Personenbetreuerin · Korridor Rumänien–Österreich");
  L.push("Kennnummer " + ref + "  ·  Erstellt am " + today);
  L.push("");
  L.push("0. ANGABEN FÜR DIE STEUER");
  dataRows().forEach(([l,v])=>L.push("  " + (l + ":").padEnd(27) + (v || "—")));
  L.push("");
  L.push("1. SITUATION");
  L.push("  In Österreich tätig seit:  " + (YEARS_LABEL[s.years]||"—"));
  L.push("  Arbeit über:               " + (CHANNEL_LABEL[s.channel]||"—"));
  L.push("  Haushalte, 12 Monate:      " + (HH_LABEL[s.households]||"—"));
  L.push("  Umsatz letztes Jahr:       " + (INCOME_LABEL[s.income]||"—"));
  L.push("  Wohnung / Zimmer:          " + (HOME_LABEL[s.home]||"—"));
  L.push("  Mittelpunkt des Lebens:    " + (CENTRE_LABEL[s.centre]||"—"));
  L.push("  Steuererklärungen:         " + (FILED_LABEL[s.filed]||"—"));
  L.push("");
  L.push("2. ANMELDUNGEN");
  const st=v=>v==="yes"?"BESTÄTIGT":v==="no"?"NICHT VORHANDEN":"UNGEKLÄRT";
  L.push("  Gewerbeberechtigung:       " + st(s.gewerbe));
  L.push("  Anmeldung bei der SVS:     " + st(s.svs));
  L.push("  Steuernummer:              " + st(s.steuernr));
  L.push("");
  L.push("3. PUNKTE, DIE FACHLICH ZU BEURTEILEN SIND");
  flags.forEach(f=>{ L.push("  [" + (f.sev==="urgent"?"EILIG":f.sev==="value"?"ANSPRUCH":"PRÜFEN") + "] " + f.t);
    L.push("     " + f.d.replace(/<[^>]+>/g,"")); });
  L.push("");
  L.push("4. VORHANDENE UNTERLAGEN");
  DOC_ORDER.forEach(d=>L.push("  " + (held.has(d)?"[x] ":"[ ] ") + DOC_LABELS[d]));
  L.push("");
  L.push("5. WAS DER KLIENTIN AM MEISTEN SORGEN MACHT");
  (worries.length?worries:["Nichts angegeben"]).forEach(w=>L.push("  · " + w));
  L.push("");
  L.push("6. FRAGEN, DER REIHE NACH");
  questions.forEach((q,i)=>L.push("  " + (i+1) + ". " + q));
  L.push("");
  L.push("Selbstauskunft, ungeprüft. Keine Steuerberatung; kein Betrag berechnet.");
  L.push("Genannte Beträge Stand " + CFG.year + "; sie ändern sich jährlich.");
  return L.join("\n");
}

/* ═══════════════════════════════════════════════════════════════════════
   KOPIEREN / SPEICHERN — mit Fallback für ältere und http-Umgebungen
   ═══════════════════════════════════════════════════════════════════════ */
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(t);
  }
  return new Promise((res, rej)=>{
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
    ok ? res() : rej();
  });
}

function downloadText(name, text){
  const blob = new Blob(["﻿" + text], {type:"text/plain;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

   KLEINTEILE
   ═══════════════════════════════════════════════════════════════════════ */
let toastT;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg || "In die Zwischenablage kopiert";
  t.classList.add("on"); clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove("on"), 2600);
}
function scrollTop(){

}

/* Vom Büro geöffnet: bereits geschickte Antworten laden, sonst den Namen vorbelegen. */
(async function boot(){
  if(!SEND_ENABLED || !CLIENT_ID){
    if(URL_YEAR && !(state.f||{}).year){ state.f = Object.assign({}, state.f, {year: URL_YEAR}); save(); }
    return;
  }
  try{
    const qs = "client_id=" + CLIENT_ID + (URL_YEAR ? "&year=" + URL_YEAR : "");
    const j = await fetch(CFG.api + "/api/questionnaire?" + qs).then(r=>r.json());
    if(j && j.answers && Object.keys(state).length===0){
      state = Object.assign({}, j.answers, {f: Object.assign({}, j.fields||{})});
    } else if(j && j.client_name){
      state.f = state.f || {};
      if(!state.f.name) state.f.name = j.client_name;
    }
    if(URL_YEAR){ state.f = state.f || {}; state.f.year = URL_YEAR; }
    save(); render();
  }catch(e){ /* Büro nicht erreichbar: Fragebogen läuft trotzdem lokal */ }
})();
