services:
  postgres:
    image: postgres:16
    container_name: intake-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: intake-n8n
    ports:
      - "5678:5678"
    depends_on:
      - postgres
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=intake
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=admin
      - DB_POSTGRESDB_PASSWORD=password
      - N8N_RUNNERS_TASK_TIMEOUT=1200
      - WHATSAPP_VERIFY_TOKEN=intake-autopilot-dev-verify-token
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./storage:/storage

  ollama:
    image: ollama/ollama
    container_name: intake-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ./storage/ollama_models:/root/.ollama

  ai-service:
    build: ./ai-service
    container_name: intake-ai
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=minicpm-v
    volumes:
      - ./ai-service:/app
      - ./storage:/storage

  backend:
    build: ./backend
    container_name: intake-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/intake
    volumes:
      - ./backend:/app
      - ./storage:/storage

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
